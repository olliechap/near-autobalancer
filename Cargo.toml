[workspace]
resolver = "3"
members = ["contracts/pool", "contracts/vault"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.86"

[workspace.dependencies]
near-sdk = { version = "=5.26.1", features = ["unstable"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
